name: Update Sub-Store Vendor

on:
  schedule:
    # 04:00 UTC = 12:00 Asia/Shanghai
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sub-Store tag to update to (default: latest release)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sub-store-vendor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check for a new Sub-Store release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          vendor=packages/core/src/vendors/Sub-Store

          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/sub-store-org/Sub-Store/releases/latest |
              node -e "const fs=require('fs'); const release=JSON.parse(fs.readFileSync(0, 'utf8')); if (!release.tag_name) throw new Error('Missing release tag_name'); console.log(release.tag_name)")
          fi

          # The tag becomes the npm package version, so keep it to a plain semver-ish shape.
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Unexpected Sub-Store tag '$tag'"
            exit 1
          fi

          version=$(node -p "require('./package.json').version")
          git -C "$vendor" fetch --tags --force --quiet
          head=$(git -C "$vendor" rev-parse HEAD)
          target=$(git -C "$vendor" rev-parse --verify --quiet "tags/$tag^{commit}" || true)
          if [ -z "$target" ]; then
            echo "::error::Sub-Store tag '$tag' not found"
            exit 1
          fi

          echo "package.json version: $version"
          echo "submodule HEAD:       $head"
          echo "latest release:       $tag ($target)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$version" ] && [ "$target" = "$head" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already on Sub-Store $tag, nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Update vendor
        if: steps.check.outputs.needed == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: pnpm update:vendor

      - name: Sync lockfile
        if: steps.check.outputs.needed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Create pull request
        if: steps.check.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/sub-store-update
          delete-branch: true
          commit-message: |
            chore: Bump version to ${{ steps.check.outputs.tag }} and update Sub-Store vendor
          title: |
            chore: Bump Sub-Store vendor to ${{ steps.check.outputs.tag }}
          body: |
            Automated update of the `Sub-Store` vendor submodule to release [`${{ steps.check.outputs.tag }}`](https://github.com/sub-store-org/Sub-Store/releases/tag/${{ steps.check.outputs.tag }}).

            Generated by `pnpm update:vendor`, which switches the submodule to the tag, syncs the workspace package versions and core dependency versions, and rebuilds `packages/core/build`.

            Please review the diff before merging.
          labels: automated
          reviewers: TBXark
          assignees: TBXark
